<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CosmixMC | Profile</title>
    <link rel="icon" href="https://cdn.discordapp.com/icons/1522777296547876884/069300e28d2be308f1c088860d7598c4.webp?size=1024" />
    <meta property="og:image" content="https://cdn.discordapp.com/icons/1522777296547876884/069300e28d2be308f1c088860d7598c4.webp?size=1024" />
    <meta property="twitter:image" content="https://cdn.discordapp.com/icons/1522777296547876884/069300e28d2be308f1c088860d7598c4.webp?size=1024" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <nav class="navbar">
        <a class="brand" href="index.html">CosmixMC</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a href="ranks.html">Ranks</a>
          <a href="staff.html">Staff</a>
          <a href="server-status.html">Server Status</a>
          <a href="rules.html">Rules</a>
          <a href="apply.html">Apply</a>
          <a href="reports.html">Reports</a>
          <a href="eaglercraft/clients.html">Eaglercraft</a>
          <a href="/profile.html">Profile</a>
        </div>
        <div class="auth-controls" id="auth-controls"></div>
      </nav>

      <main>
        <section class="panel">
          <div class="page-header">
            <p class="eyebrow">Account center</p>
            <h1>Profile and sign in</h1>
            <p>Sign up with an email, update your display name, and upload a profile picture for your website and Discord webhook identity.</p>
          </div>

          <div class="profile-grid">
            <div class="profile-card" id="auth-card">
              <h2 id="auth-form-title">Sign in</h2>
              <form id="auth-form">
                <input id="auth-mode" type="hidden" name="mode" value="login" />
                <label>
                  Email
                  <input name="email" type="email" placeholder="you@example.com" />
                </label>
                <label id="username-field" style="display:none;">
                  Username
                  <input name="username" type="text" placeholder="Your display name" />
                </label>
                <label>
                  Password
                  <input name="password" type="password" placeholder="••••••••" required />
                </label>
                <button type="submit" id="auth-submit">Sign in</button>
                <p id="auth-status" class="status-message"></p>
              </form>
              <p><a href="#" id="toggle-auth-link">Need an account? Sign up</a></p>
            </div>

            <div class="profile-card" id="profile-card" style="display:none;">
              <h2>Profile</h2>
              <img id="profile-picture-preview" class="profile-picture" alt="Profile preview" />
              <form id="profile-form" enctype="multipart/form-data">
                <label>
                  Username
                  <input name="username" id="profile-username" type="text" required />
                </label>
                <label>
                  Email
                  <input name="email" id="profile-email" type="email" />
                </label>
                <label>
                  Profile picture
                  <input name="avatar" type="file" accept="image/*" />
                </label>
                <label>
                  New password
                  <input name="password" type="password" placeholder="Leave blank to keep the current password" />
                </label>
                <button type="submit">Save profile</button>
                <p id="profile-status" class="status-message"></p>
                <button id="request-delete-button" class="button secondary" type="button" style="display:none; margin-top:0.75rem;">Request account deletion</button>
                <p id="delete-request-status" class="status-message"></p>
              </form>
            </div>
          </div>
        </section>
      </main>
    </header>

    <script src="auth-controls.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const authForm = document.getElementById('auth-form');
      const authMode = document.getElementById('auth-mode');
      const authEmailInput = document.querySelector('#auth-form input[name="email"]');
      const profileEmailInput = document.getElementById('profile-email');
      const authTitle = document.getElementById('auth-form-title');
      const toggleLink = document.getElementById('toggle-auth-link');
      const usernameField = document.getElementById('username-field');
      const authStatus = document.getElementById('auth-status');
      const profileCard = document.getElementById('profile-card');
      const profileForm = document.getElementById('profile-form');
      const profileStatus = document.getElementById('profile-status');
      const deleteRequestStatus = document.getElementById('delete-request-status');
      const deleteRequestButton = document.getElementById('request-delete-button');
      const profilePicturePreview = document.getElementById('profile-picture-preview');
      const authCard = document.getElementById('auth-card');
      const STORAGE_KEY = 'cosmix-profile-users';
      const CURRENT_USER_KEY = 'cosmix-profile-current-user';
      const DELETE_REQUEST_WEBHOOK_URL = 'https://discord.com/api/webhooks/1535316303449956416/7r2TqtW6BwAhBzoWW58sKqXJ8Z8PdNbPokwvS0taF1I7FujuH0HHt8-A8pQoyUMbknWO';

      async function sendDeletionRequestToDiscord(user, reason) {
        const payload = {
          embeds: [
            {
              title: 'Account deletion request',
              color: 0xff0000,
              description: 'A user submitted an account deletion request.',
              fields: [
                { name: 'Username', value: user?.username || 'Unknown', inline: true },
                { name: 'Email', value: user?.email || 'Not provided', inline: true },
                { name: 'Role', value: user?.role || 'member', inline: true },
                { name: 'Deletion reason', value: reason || 'No reason provided' },
              ],
              timestamp: new Date().toISOString(),
            },
          ],
        };

        const response = await fetch(DELETE_REQUEST_WEBHOOK_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const text = await response.text();
          throw new Error(text || 'Unable to send deletion request to Discord.');
        }
      }

      function setMode(mode) {
        const isSignup = mode === 'signup';
        authMode.value = mode;
        authTitle.textContent = isSignup ? 'Create account' : 'Sign in';
        usernameField.style.display = isSignup ? 'grid' : 'none';
        const usernameInput = usernameField.querySelector('input[name="username"]');
        if (usernameInput) usernameInput.required = isSignup;
        if (authEmailInput) {
          authEmailInput.required = !isSignup;
          authEmailInput.placeholder = isSignup ? 'Optional for guest accounts' : 'you@example.com';
        }
        if (profileEmailInput) {
          profileEmailInput.required = false;
        }
        document.getElementById('auth-submit').textContent = isSignup ? 'Create account' : 'Sign in';
        toggleLink.textContent = isSignup ? 'Already have an account? Sign in' : 'Need an account? Sign up';
      }

      function getStoredUsers() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (error) {
          return [];
        }
      }

      function saveStoredUsers(users) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
      }

      function normalizeUser(user) {
        const normalized = user || {};
        return {
          id: normalized.id || `local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          username: String(normalized.username || '').trim() || 'CosmixUser',
          email: String(normalized.email || '').trim().toLowerCase(),
          password: String(normalized.password || ''),
          avatar: normalized.avatar || '',
          deleteRequested: Boolean(normalized.deleteRequested),
          deleteReason: normalized.deleteReason || '',
        };
      }

      function getCurrentUser() {
        try {
          const raw = localStorage.getItem(CURRENT_USER_KEY);
          return raw ? normalizeUser(JSON.parse(raw)) : null;
        } catch (error) {
          return null;
        }
      }

      function saveCurrentUser(user) {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(normalizeUser(user)));
      }

      function clearCurrentUser() {
        localStorage.removeItem(CURRENT_USER_KEY);
      }

      function createUserId() {
        return `local-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      }

      function getErrorMessage(result, fallback) {
        if (typeof result === 'string' && result.trim()) {
          return result.trim();
        }

        if (result && typeof result === 'object') {
          if (typeof result.error === 'string' && result.error.trim()) {
            return result.error.trim();
          }

          if (typeof result.message === 'string' && result.message.trim()) {
            return result.message.trim();
          }
        }

        return fallback;
      }

      function formatResponseError(message, fallback) {
        const cleaned = String(message || '').trim();
        if (!cleaned) {
          return fallback;
        }

        return cleaned.replace(/\s+/g, ' ').slice(0, 220);
      }

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(new Error('Unable to read the selected image.'));
          reader.readAsDataURL(file);
        });
      }

      function populateProfileFields(user) {
        const profileUsername = document.getElementById('profile-username');
        const profileEmail = document.getElementById('profile-email');
        if (profileUsername) {
          profileUsername.value = user?.username || '';
        }
        if (profileEmail) {
          profileEmail.value = user?.email || '';
        }
        if (profilePicturePreview) {
          if (user?.avatar) {
            profilePicturePreview.src = user.avatar;
          } else {
            profilePicturePreview.removeAttribute('src');
          }
        }
      }

      async function loadProfile() {
        const currentUser = getCurrentUser();
        if (!currentUser) {
          profileCard.style.display = 'none';
          authCard.style.display = 'block';
          setMode(params.get('view') === 'signup' ? 'signup' : 'login');
          if (deleteRequestButton) {
            deleteRequestButton.style.display = 'none';
            deleteRequestButton.disabled = true;
          }
          if (deleteRequestStatus) {
            deleteRequestStatus.textContent = '';
          }
          await updateAuthControls();
          return;
        }

        authCard.style.display = 'none';
        profileCard.style.display = 'block';
        populateProfileFields(currentUser);
        if (deleteRequestButton) {
          deleteRequestButton.style.display = 'inline-block';
          deleteRequestButton.disabled = false;
          deleteRequestButton.textContent = currentUser.deleteRequested ? 'Deletion request saved' : 'Request account deletion';
        }
        if (deleteRequestStatus) {
          deleteRequestStatus.textContent = currentUser.deleteRequested ? 'Deletion request saved locally.' : '';
        }
        await updateAuthControls();
      }

      authForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        authStatus.textContent = 'Working...';
        const formData = new FormData(authForm);
        const email = String(formData.get('email') || '').trim().toLowerCase();
        const password = String(formData.get('password') || '').trim();
        const username = String(formData.get('username') || '').trim();

        try {
          const isSignup = authMode.value === 'signup';
          const users = getStoredUsers();

          if (isSignup) {
            const normalizedEmail = email || `${Date.now()}@guest.cosmixmc.local`;
            if (users.some((user) => (user.email || '').toLowerCase() === normalizedEmail)) {
              throw new Error('An account with that email already exists locally.');
            }

            const newUser = normalizeUser({
              id: createUserId(),
              username: username || `CosmixUser${Math.random().toString(36).slice(2, 6)}`,
              email: normalizedEmail,
              password,
            });
            users.push(newUser);
            saveStoredUsers(users);
            saveCurrentUser(newUser);
            authStatus.textContent = 'Account created locally.';
          } else {
            const matchingUser = users.find((user) => (user.email || '').toLowerCase() === email);
            if (!matchingUser || String(matchingUser.password || '') !== password) {
              throw new Error('No matching account was found. Please sign up first.');
            }
            saveCurrentUser(matchingUser);
            authStatus.textContent = 'Signed in locally.';
          }

          await loadProfile();
        } catch (error) {
          authStatus.textContent = formatResponseError(getErrorMessage(error, 'Unable to complete that request.'), 'Unable to complete that request.');
        }
      });

      profileForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        profileStatus.textContent = 'Saving profile...';
        const currentUser = getCurrentUser();
        if (!currentUser) {
          profileStatus.textContent = 'Please sign in first.';
          return;
        }

        try {
          const formData = new FormData(profileForm);
          const username = String(formData.get('username') || '').trim() || currentUser.username;
          const email = String(formData.get('email') || '').trim().toLowerCase();
          const password = String(formData.get('password') || '').trim();
          const avatarFile = formData.get('avatar');
          const users = getStoredUsers();
          const duplicate = users.find((user) => user.id !== currentUser.id && (user.email || '').toLowerCase() === email);
          if (email && duplicate) {
            throw new Error('That email is already in use locally.');
          }

          let avatar = currentUser.avatar || '';
          if (avatarFile && typeof avatarFile !== 'string' && avatarFile.size) {
            avatar = await readFileAsDataUrl(avatarFile);
          }

          const updatedUser = normalizeUser({
            ...currentUser,
            username,
            email,
            password: password || currentUser.password || '',
            avatar,
          });

          const updatedUsers = users.map((user) => (user.id === currentUser.id ? updatedUser : user));
          saveStoredUsers(updatedUsers);
          saveCurrentUser(updatedUser);
          profileStatus.textContent = 'Profile updated locally.';
          await loadProfile();
        } catch (error) {
          profileStatus.textContent = formatResponseError(getErrorMessage(error, 'Unable to save the profile.'), 'Unable to save the profile.');
        }
      });

      if (deleteRequestButton) {
        deleteRequestButton.addEventListener('click', async () => {
          const reason = window.prompt('Tell us why you want to delete your account:');
          if (!reason || !reason.trim()) {
            if (deleteRequestStatus) {
              deleteRequestStatus.textContent = 'Deletion request cancelled.';
            }
            return;
          }

          const currentUser = getCurrentUser();
          if (!currentUser) {
            if (deleteRequestStatus) {
              deleteRequestStatus.textContent = 'Please sign in first.';
            }
            return;
          }

          const users = getStoredUsers();
          const updatedUser = normalizeUser({
            ...currentUser,
            deleteRequested: true,
            deleteReason: reason.trim(),
          });
          saveStoredUsers(users.map((user) => (user.id === currentUser.id ? updatedUser : user)));
          saveCurrentUser(updatedUser);

          try {
            await sendDeletionRequestToDiscord(updatedUser, reason.trim());
            deleteRequestButton.disabled = true;
            deleteRequestButton.textContent = 'Deletion request saved';
            if (deleteRequestStatus) {
              deleteRequestStatus.textContent = 'Deletion request saved.';
            }
          } catch (error) {
            if (deleteRequestStatus) {
              deleteRequestStatus.textContent = 'Deletion request saved locally.';
            }
          }
        });
      }

      toggleLink.addEventListener('click', (event) => {
        event.preventDefault();
        setMode(authMode.value === 'signup' ? 'login' : 'signup');
      });

      async function updateAuthControls() {
        const container = document.getElementById('auth-controls');
        if (!container) return;
        const currentUser = getCurrentUser();
        if (currentUser) {
          const roles = Array.isArray(currentUser.roles) ? currentUser.roles : [];
          const isOwner = roles.includes('owner') || currentUser.role === 'owner';
          const isStaff = isOwner || currentUser.role === 'staff' || currentUser.role === 'admin' || roles.includes('staff') || roles.includes('admin');
          const extraLinks = isStaff
            ? '<a class="button secondary small" href="staff.html">Staff</a><a class="button secondary small" href="reports.html">Reports</a>'
            : '';
          const ownerUsersLink = isOwner ? '<a class="button secondary small" href="owner-users.html">Owner users</a>' : '';
          container.innerHTML = `<a class="button secondary small" href="/profile.html">${currentUser.username || 'Profile'}</a>${extraLinks}${ownerUsersLink}<button class="button secondary small" id="signout-button" type="button">Sign out</button>`;
          const signoutButton = document.getElementById('signout-button');
          if (signoutButton) {
            signoutButton.addEventListener('click', async () => {
              clearCurrentUser();
              await updateAuthControls();
              await loadProfile();
            });
          }
        } else {
          container.innerHTML = `<a class="button secondary small" href="/profile.html">Sign in</a><a class="button secondary small" href="/profile.html?view=signup">Sign up</a>`;
        }
      }

      updateAuthControls();
      loadProfile();
    </script>
  </body>
</html>
